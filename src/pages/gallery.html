    <div class="container">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <ol>
          <li><a href="/">Home</a></li>
          <li aria-current="page">Gallery</li>
        </ol>

      <header class="page-head page-head--split">
        <div>
          <p class="eyebrow">Gallery</p>
          <h1 class="display-l">The Beauty Crib <em>world.</em></h1>
        </div>
        <div>
          <p class="page-head__lead">

      <section class="section">

          <div>
            <p class="eyebrow">Shop the look</p>
            <h2 class="display-m">What is in the pictures</h2>
          </div>
          <a class="btn btn--text" href="/shop/">All products</a>
        </div>
        <div class="product-row">{{featuredGrid}}</div>
      </section>
